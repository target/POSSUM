plugins {
    id 'java'
    id 'maven-publish'
    id 'idea'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'de.undercouch.download' version '5.6.0'
    id 'jacoco'
    id 'org.barfuin.gradle.jacocolog' version '3.1.0'
    id 'com.gradleup.shadow' version '9.2.2'
}

application {
    mainClassName = 'com.target.devicemanager.DeviceMain'
}

group 'com.target'
version '1.0'

sourceCompatibility = '17'

repositories {
    mavenCentral()
}

ext['log4j2.version'] = '2.25.5'
ext['logback.version'] = '1.6.3'
ext['jackson-bom.version'] = '3.1.6'

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-webmvc") {
        exclude group: "org.apache.logging.log4j"
    }
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "org.springframework.boot:spring-boot-loader"
    implementation "org.springframework:spring-webmvc"
    implementation "org.springframework:spring-web"
    implementation "org.springframework:spring-core"
    implementation "org.springframework.security:spring-security-core"
    implementation "org.junit.platform:junit-platform-launcher"
    implementation "org.junit.platform:junit-platform-commons"
    implementation "org.junit.platform:junit-platform-engine"
    implementation "org.javapos:javapos-config-loader:4.0.2"
    implementation "org.javapos:javapos:1.14.4"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1"
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "tools.jackson.core:jackson-databind"
    implementation "tools.jackson.dataformat:jackson-dataformat-yaml"

    implementation "jakarta.servlet:jakarta.servlet-api"
    implementation "jakarta.validation:jakarta.validation-api"
    implementation "jakarta.annotation:jakarta.annotation-api"
    implementation "org.apache.logging.log4j:log4j-api"
    implementation "org.apache.logging.log4j:log4j-core"
    implementation "org.apache.logging.log4j:log4j-1.2-api"
    implementation "org.apache.commons:commons-lang3"
    implementation "net.logstash.logback:logstash-logback-encoder:8.1"
    implementation "org.yaml:snakeyaml"
    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation "io.github.classgraph:classgraph:4.8.179"

    // Temporary migration aid: uncomment to log renamed/removed config properties at startup,
    // then remove once application.properties has been updated.
    // runtimeOnly "org.springframework.boot:spring-boot-properties-migrator"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.apache.tomcat.embed") {
            details.useVersion("11.0.26")
        }
    }
}

tasks.withType(JavaExec) {
    systemProperties System.properties
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    testLogging {
        events "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.13"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

build {
    dependsOn("copyRuntimeJars")
}

task copyRuntimeJars(type: Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/libs"
}

shadowJar {
    archiveClassifier.set("")
}

bootJar {
    archiveClassifier.set("")
    manifest {
        attributes(
                'Main-Class': 'org.springframework.boot.loader.launch.PropertiesLauncher'
        )
    }
}

task generatePom {
    doLast {
        pom {
            project {
                licenses {
                    license {
                        name 'MIT'
                        url 'http://www.opensource.org/licenses/mit-license.php'
                        distribution 'repo'
                        comments 'All source code is under the MIT license.'
                    }
                }
            }
        }.writeTo("$buildDir/pom/$archivesBaseName-$version" + ".pom")
    }
}
